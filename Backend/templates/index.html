<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Upload Only</title>
</head>
<body>
    <h2>Upload your PDF Document</h2>
    
    <form action="http://127.0.0.1:8000/upload_resume" method="POST" enctype="multipart/form-data">
        
        <label for="pdf-file">Select PDF:</label>
        <input type="file" id="pdf-file" name="pdf_file" accept=".pdf" required>
        
        <br><br>
        <button type="submit">Upload Resume</button>
    </form>
</body>
</html>
